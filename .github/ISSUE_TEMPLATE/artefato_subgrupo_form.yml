name: Artefato de subgrupo
description: Criar ou evoluir um artefato de padrões de projeto da Entrega 03
title: "[SubEquipe_XX] "
labels: ["entrega-03"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Use uma issue por artefato. Mantenha o escopo pequeno e verificável e relacione o PR que concluir a atividade.

  - type: dropdown
    id: subequipe
    attributes:
      label: Subequipe
      options:
        - SubEquipe_01
        - SubEquipe_02
        - SubEquipe_03
    validations:
      required: true

  - type: dropdown
    id: artefato
    attributes:
      label: Artefato
      options:
        - GoF Criacional
        - GoF Estrutural
        - GoF Comportamental
        - IA Generativa
        - Iniciativa extra
        - Outro
    validations:
      required: true

  - type: input
    id: responsaveis
    attributes:
      label: Responsável(is)
      placeholder: "@usuario"
    validations:
      required: true

  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo e escopo
      description: Diga qual padrão será aplicado, que problema do jogo ele resolve e quais partes do sistema estão no escopo.
      placeholder: |
        Padrão escolhido: ...
        Problema a resolver: ...
        Escopo principal: ...
        Fora do escopo: ...
    validations:
      required: true

  - type: textarea
    id: tarefas
    attributes:
      label: Tarefas
      placeholder: |
        - [ ] Descrever o contexto e o problema que justificam o padrão
        - [ ] Elaborar a modelagem do padrão na notação UML
        - [ ] Adicionar fonte editável e versão renderizada do modelo ao repositório
        - [ ] Implementar o padrão e explicar os trechos de código de cada participante
        - [ ] Gravar o vídeo com o padrão em execução
        - [ ] Documentar decisões relevantes e referências
        - [ ] Validar a renderização e abrir o PR
    validations:
      required: true

  - type: textarea
    id: referencias
    attributes:
      label: Referências e dependências
      description: Relacione atas, requisitos, artefatos das entregas anteriores ou materiais da disciplina quando aplicável.
      placeholder: |
        - Ata/decisão de origem:
        - Requisitos relacionados:
        - Artefatos relacionados:
        - Dependências:
    validations:
      required: false

  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceitação
      placeholder: |
        - [ ] O modelo está coerente com a notação UML e com a estrutura do padrão na literatura
        - [ ] O código implementa os participantes do padrão e está hospedado no repositório
        - [ ] O vídeo mostra o padrão em execução
        - [ ] O conteúdo representa o escopo definido na issue
        - [ ] O artefato está referenciado na documentação da Entrega 03
        - [ ] O PR relacionado foi revisado
    validations:
      required: true
